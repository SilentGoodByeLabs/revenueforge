services:
  - type: web
    name: revenueforge-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.ui.webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: cron
    name: revenueforge-keepalive
    schedule: "*/5 * * * *"
    runtime: static
    buildCommand: ""
    startCommand: curl -s https://revenueforge-api.onrender.com/keepalive
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
