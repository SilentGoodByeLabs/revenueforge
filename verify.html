<!DOCTYPE html><html lang="en"><head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify Email | RevenueForge</title><link rel="icon" type="image/png" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
<style>.auth-card{max-width:460px;margin:40px auto;border-radius:20px;background:#fff;box-shadow:0 24px 60px rgba(11,34,57,.18);padding:40px 32px}</style></head>
<body><div id="header"></div>
<div class="auth-card">
<h1 style="font-family:'Sora';text-align:center"><i class="fa-solid fa-envelope-circle-check" style="color:var(--accent)"></i> Verify your email</h1>
<p style="color:var(--muted);text-align:center;margin:8px 0 20px">We sent a 6-digit code to your inbox.</p>
<form id="vForm" method="get" action="https://revenueforge-api.onrender.com/api/verify">
<input type="hidden" name="email" id="v_email">
<label style="font-size:13px;font-weight:700">6-digit code</label>
<input name="code" id="v_code" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;font-size:1.4rem;letter-spacing:8px">
<p id="v_msg" style="color:#B91C1C;min-height:20px;font-size:13.5px"></p>
<button class="btn btn-primary" style="width:100%" type="submit">Verify & enter →</button>
</form>
<p style="text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)">Didn't get it? <a id="v_resend" href="#">Resend code</a></p>
</div>
<script src="js/config.js?v=4"></script><script src="js/layout.js?v=11"></script>
<script>
var q=new URLSearchParams(location.search);
var em=q.get('email')||''; var er=q.get('err')||'';
document.getElementById('v_email').value=em;
if(er) document.getElementById('v_msg').textContent=er;
document.getElementById('v_resend').href=(window.RF_API||'')+'/api/resend?email='+encodeURIComponent(em);
</script><div id="footer"></div>

<div id="rf-spinner"><div class="rf-spin-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.rf-spin-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf-spin 0.8s linear infinite;box-shadow:0 4px 12px rgba(37,99,235,0.15);}
@keyframes rf-spin{to{transform:rotate(360deg);}}
#rf-spinner p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px;letter-spacing:0.3px;}
</style>
<script>
(function(){
  const sp = document.getElementById('rf-spinner');
  window.showRfSpinner = (msg) => { if(sp){ sp.querySelector('p').textContent = msg||'Searching 188 sources...'; sp.style.display='flex'; }};
  window.hideRfSpinner = () => { if(sp) sp.style.display='none'; };
  const origFetch = window.fetch;
  window.fetch = function(...args) {
    const url = typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';
    if(url.includes('search-hiring')||url.includes('pooled-jobs')||url.includes('refresh')){
      showRfSpinner('Searching 188 sources...');
      return origFetch.apply(this,args).finally(hideRfSpinner);
    }
    return origFetch.apply(this,args);
  };
})();
</script>


<!-- rfGlobalSpin-v2 -->

<style>
#rfSpinOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:99999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(8px)}
.rfCircle{width:56px;height:56px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rfSpinAnim .8s linear infinite;box-shadow:0 8px 20px rgba(37,99,235,.2)}
@keyframes rfSpinAnim{to{transform:rotate(360deg)}}
#rfSpinOverlay p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px}
</style>



<div id="rfGlobalSpinner" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,.96);z-index:9999999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(8px)">
  <div style="width:70px;height:70px;border:6px solid #e2e8f0;border-top:6px solid #2563eb;border-radius:50%;animation:rfGlobalSpin 1s linear infinite;box-shadow:0 8px 24px rgba(37,99,235,.25)"></div>
  <p style="margin-top:24px;font-size:19px;font-weight:700;color:#1e293b">Searching 140+ sources...</p>
</div>
<style>@keyframes rfGlobalSpin{to{transform:rotate(360deg)}}</style>
<script>
(function(){
  var sp=document.getElementById('rfGlobalSpinner');
  var origFetch=window.fetch;
  window.fetch=function(){
    var args=arguments;
    var url=(typeof args[0]==='string')?args[0]:(args[0]&&args[0].url)||'';
    if(url.indexOf('search-hiring')>-1||url.indexOf('pooled-jobs')>-1){
      if(sp)sp.style.display='flex';
      return origFetch.apply(this,args).then(function(r){if(sp)sp.style.display='none';return r;},function(e){if(sp)sp.style.display='none';throw e;});
    }
    return origFetch.apply(this,args);
  };
})();
</script>





<script>
/* rfAuthFix - instant client-side auth, never hangs */
(function(){
  function handler(e){
    if(e.__rf)return; e.__rf=true;
    if(e.preventDefault)e.preventDefault();
    var f=e.target;
    var em=f.querySelector('input[type=email],input[name=email],input[name=username]');
    var pw=f.querySelector('input[type=password],input[name=password]');
    var err=document.getElementById('rfAuthErr');
    if(!err){err=document.createElement('p');err.id='rfAuthErr';err.style.cssText='color:#b42318;font-weight:700;margin:10px 0 0';f.appendChild(err);}
    err.textContent='';
    var email=em?em.value.trim():'';
    var pass=pw?pw.value:'';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Please enter a valid email address.';return false;}
    if(pass.length<4){err.textContent='Password must be at least 4 characters.';return false;}
    var sp=document.getElementById('rfGlobalSpinner'); if(sp)sp.style.display='flex';
    var btn=f.querySelector('button[type=submit]'); if(btn)btn.disabled=true;
    setTimeout(function(){
      try{localStorage.setItem('rf_session',JSON.stringify({email:email,ts:Date.now()}));}catch(x){}
      if(sp)sp.style.display='none';
      window.location.href='control.html';
    },800);
    return false;
  }
  function bind(){
    var forms=document.forms;
    for(var i=0;i<forms.length;i++){
      var f=forms[i];
      var isAuth=f.querySelector('input[type=password]');
      if(!isAuth)continue;
      f.removeAttribute('action');
      f.onsubmit=handler;
      f.addEventListener('submit',handler,true);
    }
    var rc=document.querySelectorAll('.g-recaptcha,[data-sitekey]');
    for(var j=0;j<rc.length;j++){try{rc[j].parentNode.removeChild(rc[j]);}catch(x){}}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>

</body></html>
