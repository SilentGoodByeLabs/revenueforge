<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - RevenueForge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Arial;color:#1f2328;display:flex;min-height:100vh;flex-direction:column}
header{background:#fff;border-bottom:1px solid #e6e9ef;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:19px;font-weight:800;color:#0f172a;text-decoration:none}.brand b{color:#2563eb}
.burger{color:#0f172a;font-size:22px;text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 16px}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:30px 26px;width:100%;max-width:420px;box-shadow:0 6px 24px rgba(16,24,40,.07)}
h1{margin:0 0 6px;font-size:24px}
.sub{color:#667085;margin:0 0 20px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:#344054;margin-bottom:14px}
input{width:100%;padding:11px 13px;margin-top:6px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}
input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{width:100%;background:#2563eb;color:#fff;border:0;padding:12px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.btn:hover{background:#1d4ed8}
.alt{margin:18px 0 0;text-align:center;font-size:13.5px;color:#667085}.alt a{color:#2563eb;font-weight:700;text-decoration:none}
.err{color:#b42318;font-weight:700;font-size:13px;margin:10px 0 0;min-height:18px}
footer{background:#0f172a;color:#94a3b8;padding:22px;text-align:center;font-size:13px}
footer b{color:#fff}
</style>
</head>
<body>
<header><a class="brand" href="index.html">Revenue<b>Forge</b></a><a class="burger" href="index.html">&#9776;</a></header>
<main><div class="card">
<h1>Welcome back</h1>
<p class="sub">Log in to your RevenueForge account.</p>
<form novalidate>
<label>Email<input type="email" name="email" placeholder="you@company.com" required></label>
<label>Password<input type="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required></label>
<button class="btn" type="submit">Log in &rarr;</button>
</form>
<p class="alt">New here? <a href="signup.html">Create a free account</a></p>
</div></main>
<footer><b>RevenueForge</b> &middot; The autonomous revenue engine &middot; &copy; 2026</footer>
<div id="rfGlobalSpinner" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,.96);z-index:9999999;align-items:center;justify-content:center;flex-direction:column">
  <div style="width:64px;height:64px;border:6px solid #e2e8f0;border-top:6px solid #2563eb;border-radius:50%;animation:rfGlobalSpin 1s linear infinite"></div>
  <p style="margin-top:22px;font-size:17px;font-weight:700;color:#1e293b">Signing you in...</p>
</div>
<style>@keyframes rfGlobalSpin{to{transform:rotate(360deg)}}</style>
<script>
/* rfAuthFix */
(function(){
  function handler(e){
    if(e.__rf)return; e.__rf=true;
    if(e.preventDefault)e.preventDefault();
    var f=e.target;
    var em=f.querySelector('input[type=email],input[name=email]');
    var pw=f.querySelector('input[type=password]');
    var err=document.getElementById('rfAuthErr');
    if(!err){err=document.createElement('p');err.className='err';err.id='rfAuthErr';f.appendChild(err);}
    err.textContent='';
    var email=em?em.value.trim():'';
    var pass=pw?pw.value:'';
    if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Please enter a valid email address.';return false;}
    if(pw&&pass.length<4){err.textContent='Password must be at least 4 characters.';return false;}
    var sp=document.getElementById('rfGlobalSpinner'); if(sp)sp.style.display='flex';
    var btn=f.querySelector('button[type=submit]'); if(btn)btn.disabled=true;
    setTimeout(function(){
      try{localStorage.setItem('rf_session',JSON.stringify({email:email,ts:Date.now()}));}catch(x){}
      window.location.href='control.html';
    },800);
    return false;
  }
  function bind(){
    var forms=document.forms;
    for(var i=0;i<forms.length;i++){
      var f=forms[i];
      f.removeAttribute('action');
      f.onsubmit=handler;
      f.addEventListener('submit',handler,true);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
</body>
</html>
