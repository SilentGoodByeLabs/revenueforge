<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Log In | RevenueForge</title><link rel="icon" type="image/png" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>.auth-sec{min-height:calc(100vh - 140px);display:flex;align-items:center;padding:40px 16px}.auth-card{max-width:460px;margin:0 auto;border-radius:20px;background:#fff;box-shadow:0 24px 60px rgba(11,34,57,.18);padding:40px 32px}.auth-card h1{font-family:'Sora';font-size:1.5rem;text-align:center}.auth-card .sub{color:var(--muted);font-size:.92rem;margin:6px 0 22px;text-align:center}.auth-card label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.auth-card input{width:100%;margin:6px 0 14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}.auth-card input:focus{outline:none;border-color:var(--accent)}.g-recaptcha{margin:6px 0 14px}.auth-card .btn{width:100%;padding:13px;font-size:1rem;border-radius:12px}.auth-card .alt{margin-top:14px;font-size:13.5px;color:var(--muted);text-align:center}@media (max-width:520px){.auth-card{padding:30px 20px}}</style></head><body>
<script>try{var _s=JSON.parse(localStorage.getItem('rf_session')||'null');if(_s&&_s.email&&location.search.indexOf('err=')<0)location.replace('portal.html');}catch(e){}</script>
<div id="header"></div>
<section class="auth-sec"><div class="auth-card">
  <h1>Welcome back</h1>
  <p class="sub">Log in with your email.</p>
  <form id="liForm" method="get" action="https://revenueforge-api.onrender.com/api/login-get">
    <label>Email</label>
    <input name="email" id="li_email" type="email" autocomplete="username" required>
    <label>Password</label>
    <input name="password" id="li_pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <label>Human verification</label>
    <div class="g-recaptcha" data-sitekey="6Lc-5ogtAAAAALRP2NOwo5mPU0MUf1MITyOAwJW4"></div>
    <p id="li_msg" style="color:#B91C1C;min-height:20px;font-size:13.5px"></p>
    <button class="btn btn-primary" type="submit">Log in →</button>
  </form>
  <p class="alt">New here? <a href="register.html">Create a free account</a></p>
</div></section><div id="footer"></div>
<script src="js/config.js"></script><script src="js/layout.js"></script><script src="js/auth.js"></script><script>
(function(){ var q = new URLSearchParams(location.search); var e = q.get('err'); if(e){ var m = document.getElementById('li_msg'); if(m) m.textContent = e; } })();
</script>

<div id="rf-spinner"><div class="rf-spin-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.rf-spin-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf-spin 0.8s linear infinite;box-shadow:0 4px 12px rgba(37,99,235,0.15);}
@keyframes rf-spin{to{transform:rotate(360deg);}}
#rf-spinner p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px;letter-spacing:0.3px;}
</style>
<script>
(function(){
  const sp = document.getElementById('rf-spinner');
  window.showRfSpinner = (msg) => { if(sp){ sp.querySelector('p').textContent = msg||'Searching 188 sources...'; sp.style.display='flex'; }};
  window.hideRfSpinner = () => { if(sp) sp.style.display='none'; };
  const origFetch = window.fetch;
  window.fetch = function(...args) {
    const url = typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';
    if(url.includes('search-hiring')||url.includes('pooled-jobs')||url.includes('refresh')){
      showRfSpinner('Searching 188 sources...');
      return origFetch.apply(this,args).finally(hideRfSpinner);
    }
    return origFetch.apply(this,args);
  };
})();
</script>


<!-- rfGlobalSpin-v2 -->
<div id="rfSpinOverlay"><div class="rfCircle"></div><p id="rfSpinText">Searching 188 sources...</p></div>
<style>
#rfSpinOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:99999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(8px)}
.rfCircle{width:56px;height:56px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rfSpinAnim .8s linear infinite;box-shadow:0 8px 20px rgba(37,99,235,.2)}
@keyframes rfSpinAnim{to{transform:rotate(360deg)}}
#rfSpinOverlay p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px}
</style>
<script>
(function(){var ov=document.getElementById('rfSpinOverlay');var origFetch=window.fetch;window.fetch=function(){var args=arguments,url=typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';if(url.indexOf('search-hiring')>-1||url.indexOf('pooled-jobs')>-1||url.indexOf('refresh')>-1){if(ov)ov.style.display='flex';return origFetch.apply(this,args).then(function(r){if(ov)ov.style.display='none';return r},function(e){if(ov)ov.style.display='none';throw e});}return origFetch.apply(this,args);};})();
</script>

</body></html>
