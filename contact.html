<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us — RevenueForge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter;background:#F4F6FA;padding:40px 16px}.card{background:#fff;border-radius:16px;padding:28px;max-width:560px;margin:0 auto}
h1{font-family:Sora;font-size:1.5rem}textarea,input{width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;margin-top:10px;font-size:14px;font-family:inherit}
button{width:100%;margin-top:14px;background:#2563EB;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
a{color:#2563EB;font-weight:700}.muted{color:#64748B;font-size:.88rem}</style></head><body>
<div class="card"><h1>Contact Us</h1><p class="muted">Have a question? We reply within 24 hours.</p>
<input id="em" type="email" placeholder="Your email"><textarea id="ms" rows="5" placeholder="How can we help?"></textarea>
<button id="go">Send message</button>
<p class="muted" style="margin-top:14px">Or email directly: <a href="mailto:silentgoodbyelabs@gmail.com?subject=Contact%20form">silentgoodbyelabs@gmail.com</a></p>
<div id="ok" class="muted"></div></div>
<script>
var API='https://revenueforge-api.onrender.com';
document.getElementById('go').addEventListener('click',function(){
 fetch(API+'/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value,message:document.getElementById('ms').value})})
 .then(function(r){return r.json();}).then(function(d){document.getElementById('ok').textContent=d.ok?'✓ Message sent — we will reply to your email.':'Error sending, try email instead.';});
});
</script></body></html>
