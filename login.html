<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login | RevenueForge</title>
<link rel="stylesheet" href="css/auth.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head><body>
<div class="auth-wrap"><div class="auth-card">
<div class="logo">Revenue<b>Forge</b></div>
<h1>Welcome back</h1><p class="sub">Log in to your dashboard</p>
<form id="loginForm" action="/api/login-get" method="GET">
<label for="em">Email address</label>
<input id="em" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
<label for="password">Password</label>
<input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
<input type="hidden" name="g-recaptcha-response" id="gResp">
<div class="recaptcha-wrap"><div class="g-recaptcha" data-sitekey="6Lc-5ogtAAAAALRP2NOwo5mPU0MUf1MITyOAwJW4"></div></div>
<button class="btn-primary" type="submit" id="loginBtn">Log In</button>
<div id="formMsg" class="form-msg"></div>
</form>
<p class="auth-alt">New here? <a href="/signup.html">Create an account</a> &nbsp;·&nbsp; <a href="/forgot.html">Forgot password?</a></p>
</div></div>
<script>
(function(){
  var f=document.getElementById('loginForm'),m=document.getElementById('formMsg');
  var q=new URLSearchParams(location.search);
  if(q.get('error')){m.className='form-msg err';m.textContent='Invalid email or password. Try again or create an account.';}
  if(q.get('created')){m.className='form-msg ok';m.textContent='Account created successfully - log in below.';}
  f.addEventListener('submit',function(e){
    var w=document.querySelector('.g-recaptcha');
    if(w&&window.grecaptcha){var r=grecaptcha.getResponse();
      if(!r){e.preventDefault();m.className='form-msg err';m.textContent='Please tick the "I am not a robot" box.';return;}
      document.getElementById('gResp').value=r;}
    document.getElementById('loginBtn').disabled=true;
  });
})();
</script>
</body></html>
