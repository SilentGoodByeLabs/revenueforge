<div id="rf-spinner"><div class="rf-spin-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.rf-spin-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf-spin 0.8s linear infinite;box-shadow:0 4px 12px rgba(37,99,235,0.15);}
@keyframes rf-spin{to{transform:rotate(360deg);}}
#rf-spinner p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px;letter-spacing:0.3px;}
</style>
<script>
(function(){
  const sp = document.getElementById('rf-spinner');
  window.showRfSpinner = (msg) => { if(sp){ sp.querySelector('p').textContent = msg||'Searching 188 sources...'; sp.style.display='flex'; }};
  window.hideRfSpinner = () => { if(sp) sp.style.display='none'; };
  const origFetch = window.fetch;
  window.fetch = function(...args) {
    const url = typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';
    if(url.includes('search-hiring')||url.includes('pooled-jobs')||url.includes('refresh')){
      showRfSpinner('Searching 188 sources...');
      return origFetch.apply(this,args).finally(hideRfSpinner);
    }
    return origFetch.apply(this,args);
  };
})();
</script>


<!-- rfGlobalSpin-v2 -->
<div id="rfSpinOverlay"><div class="rfCircle"></div><p id="rfSpinText">Searching 188 sources...</p></div>
<style>
#rfSpinOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:99999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(8px)}
.rfCircle{width:56px;height:56px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rfSpinAnim .8s linear infinite;box-shadow:0 8px 20px rgba(37,99,235,.2)}
@keyframes rfSpinAnim{to{transform:rotate(360deg)}}
#rfSpinOverlay p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px}
</style>
<script>
(function(){var ov=document.getElementById('rfSpinOverlay');var origFetch=window.fetch;window.fetch=function(){var args=arguments,url=typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';if(url.indexOf('search-hiring')>-1||url.indexOf('pooled-jobs')>-1||url.indexOf('refresh')>-1){if(ov)ov.style.display='flex';return origFetch.apply(this,args).then(function(r){if(ov)ov.style.display='none';return r},function(e){if(ov)ov.style.display='none';throw e});}return origFetch.apply(this,args);};})();
</script>


<script>
/* captchaGuard - blocks submit until YOUR google captcha is ticked */
document.addEventListener('submit',function(e){
  var w=document.querySelector('.g-recaptcha');
  if(w&&window.grecaptcha&&!grecaptcha.getResponse()){
    e.preventDefault();
    var m=document.getElementById('capErr');
    if(!m){m=document.createElement('p');m.id='capErr';m.style.cssText='color:#b42318;font-weight:700;font-size:13px;margin:8px 0 0';w.parentNode.insertBefore(m,w.nextSibling);}
    m.textContent='Please complete the captcha to continue.';
  }
},true);
</script>
