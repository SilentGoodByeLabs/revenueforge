<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | RevenueForge</title>
<link rel="stylesheet" href="css/auth.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head><body>
<div class="auth-wrap"><div class="auth-card">
<div class="logo">Revenue<b>Forge</b></div>
<h1>Create your account</h1><p class="sub">Start your 24-hour free trial - no card required</p>
<form id="signupForm">
<label for="nm">Full name</label>
<input id="nm" type="text" required placeholder="Your name">
<label for="em">Email address</label>
<input id="em" type="email" required placeholder="you@company.com">
<label for="pw">Password (min 6 characters)</label>
<input id="pw" type="password" required minlength="6" placeholder="Choose a password">
<label for="pw2">Confirm password</label>
<input id="pw2" type="password" required minlength="6" placeholder="Repeat password">
<div class="recaptcha-wrap"><div class="g-recaptcha" data-sitekey="6Lc-5ogtAAAAALRP2NOwo5mPU0MUf1MITyOAwJW4"></div></div>
<button class="btn-primary" type="submit" id="sBtn">Create Account</button>
<div id="formMsg" class="form-msg"></div>
</form>
<p class="auth-alt">Already have an account? <a href="/login.html">Log in</a></p>
</div></div>
<script>
document.getElementById('signupForm').addEventListener('submit',function(e){
  e.preventDefault();
  var m=document.getElementById('formMsg');
  var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  if(pw!==pw2){m.className='form-msg err';m.textContent='Passwords do not match.';return;}
  var w=document.querySelector('.g-recaptcha');
  if(w&&window.grecaptcha&&!grecaptcha.getResponse()){m.className='form-msg err';m.textContent='Please tick the "I am not a robot" box.';return;}
  document.getElementById('sBtn').disabled=true;
  fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('nm').value,email:document.getElementById('em').value,password:pw})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.ok){location.href='/login.html?created=1';}
    else{m.className='form-msg err';m.textContent=d.detail||'Signup failed.';document.getElementById('sBtn').disabled=false;}
  })
  .catch(function(){m.className='form-msg err';m.textContent='Network error - try again.';document.getElementById('sBtn').disabled=false;});
});
</script>
</body></html>
