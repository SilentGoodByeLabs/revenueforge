<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | RevenueForge</title><link rel="icon" type="image/png" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div>
<section class="page-hero"><div class="container"><h1>Create your account</h1><p>Free to join. Pay only when you activate a plan.</p></div></section>
<section class="section"><div class="container" style="max-width:460px"><div class="card">
<label style="font-size:13px;font-weight:600">Email</label>
<input id="su_email" type="email" placeholder="you@example.com">
<label style="font-size:13px;font-weight:600">Phone (WhatsApp preferred)</label>
<input id="su_phone" type="tel" placeholder="+234 800 000 0000">
<label style="font-size:13px;font-weight:600">Password (6+ characters)</label>
<input id="su_pass" type="password" placeholder="••••••••">
<label style="font-size:13px;font-weight:600;color:var(--muted)">Staff code (optional — leave blank)</label>
<input id="su_code" type="text" placeholder="Only for team members">
<p id="su_msg" style="color:#B91C1C;min-height:20px"></p>
<button class="btn btn-primary" style="width:100%" onclick="rfSignup()">Create my account</button>
<p style="margin-top:12px;color:var(--muted);font-size:13px">Already have an account? <a href="login.html">Log in</a></p>
</div></div></section><div id="footer"></div>
<script src="js/config.js"></script><script src="js/layout.js"></script><script src="js/auth.js"></script></body></html>
