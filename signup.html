<body>
<div id="header"></div>
<section class="auth-wrap">
  <div class="auth-box">
    <h1>Request Access</h1>
    <p class="sub">Client portal access is invite-only. Request a code via the contact page if you don't have one.</p>
    <form id="signupForm">
      <label for="name">Full name</label>
      <input id="name" type="text" required autocomplete="name">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password (min 8 characters)</label>
      <input id="password" type="password" required autocomplete="new-password">
      <label for="invite">Access code</label>
      <input id="invite" type="text" required>
      <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off">
      <div class="captcha-box">
        <span class="q" id="captchaQ"></span>
        <input id="captchaA" type="text" inputmode="numeric" required aria-label="CAPTCHA answer">
        <button type="button" class="captcha-refresh" onclick="RFSecurity.newCaptcha()" aria-label="New CAPTCHA"><i class="fa-solid fa-rotate"></i></button>
      </div>
      <div style="margin-top:18px"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Create Account</button></div>
      <div id="formMsg" class="form-msg"></div>
    </form>
    <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>
<div id="footer"></div>

<style>
  /* Prevent footer and containers from causing horizontal scroll on mobile */
  footer, .footer, footer div, footer p {
    max-width: 100vw !important;
    box-sizing: border-box !important;
    word-wrap: break-word !important;
    overflow-x: hidden !important;
  }
  body { overflow-x: hidden !important; }
  .container, .wrapper, main, section { max-width: 100% !important; box-sizing: border-box !important; }

<div id="rf-spinner"><div class="rf-spin-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.rf-spin-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf-spin 0.8s linear infinite;box-shadow:0 4px 12px rgba(37,99,235,0.15);}
@keyframes rf-spin{to{transform:rotate(360deg);}}
#rf-spinner p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px;letter-spacing:0.3px;}
</style>
<script>
(function(){
  const sp = document.getElementById('rf-spinner');
  window.showRfSpinner = (msg) => { if(sp){ sp.querySelector('p').textContent = msg||'Searching 188 sources...'; sp.style.display='flex'; }};
  window.hideRfSpinner = () => { if(sp) sp.style.display='none'; };
  const origFetch = window.fetch;
  window.fetch = function(...args) {
    const url = typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';
    if(url.includes('search-hiring')||url.includes('pooled-jobs')||url.includes('refresh')){
      showRfSpinner('Searching 188 sources...');
      return origFetch.apply(this,args).finally(hideRfSpinner);
    }
    return origFetch.apply(this,args);
  };
})();
</script>


<!-- rfGlobalSpin -->
<div id="rf-spin-overlay"><div class="rf2-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spin-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:99999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px)}
.rf2-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf2spin .8s linear infinite}
@keyframes rf2spin{to{transform:rotate(360deg)}}
#rf-spin-overlay p{margin-top:18px;font-weight:600;color:#1e293b}
</style>
<script>
(function(){var ov=document.getElementById('rf-spin-overlay');var of=window.fetch;window.fetch=function(){var a=arguments,u=(typeof a[0]==='string')?a[0]:((a[0]&&a[0].url)||'');if(u.indexOf('search-hiring')>-1||u.indexOf('pooled-jobs')>-1){ov.style.display='flex';return of.apply(this,a).then(function(r){ov.style.display='none';return r},function(e){ov.style.display='none';throw e});}return of.apply(this,a);};})();
</script>
