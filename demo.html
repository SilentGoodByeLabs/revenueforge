<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RevenueForge Demo</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B2239;font-family:'Inter',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:92%;max-width:420px;background:#123B5C;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-family:'Sora';font-weight:800;font-size:1.2rem;margin-bottom:4px}
.logo b{color:#4D8DFF}
.sub{color:#7C93A8;font-size:.8rem;margin-bottom:18px}
.line{background:#0B2239;border-radius:10px;padding:12px;margin-bottom:12px;font-size:.9rem;min-height:20px}
.typing::after{content:'|';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.match{opacity:0;transform:translateY(10px);transition:.5s}
.match.show{opacity:1;transform:none}
.match .t{font-weight:600}
.match .m{color:#7C93A8;font-size:.75rem}
.score{float:right;background:#16A34A;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700}
.scan{color:#4D8DFF;font-size:.85rem}
.done{color:#16A34A;font-weight:700}
.cta{margin-top:16px;text-align:center;background:#2563EB;border-radius:12px;padding:14px;font-weight:700;opacity:0;transition:.6s}
.cta.show{opacity:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16A34A;margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
</style></head><body>
<div class="box">
  <div class="logo">Revenue<b>Forge</b></div>
  <div class="sub"><span class="dot"></span>Autonomous Revenue Engine</div>
  <div class="line" id="skills"></div>
  <div class="line scan" id="scan" style="display:none">Scanning Reddit · Upwork · LinkedIn · X · RemoteOK…</div>
  <div id="matches"></div>
  <div class="line done" id="done" style="display:none">✓ Proposal written & ready to submit</div>
  <div class="cta" id="cta">Get your FREE job audit → revenueforge.github.io</div>
</div>
<script>
var JOBS=[["Python invoice automation","Reddit"],["Web scraping engineer","RemoteOK"],["AI chatbot developer","Upwork"]];
var scores=[82,78,74];
function type(el,text,cb){var i=0;el.classList.add('typing');var t=setInterval(function(){el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(t);el.classList.remove('typing');cb();}},40);}
type(document.getElementById('skills'),'skills: python · automation · web scraping',function(){
  document.getElementById('scan').style.display='block';
  setTimeout(function(){
    document.getElementById('scan').innerHTML='✓ 3 matches found';
    JOBS.forEach(function(j,i){setTimeout(function(){
      var d=document.createElement('div');d.className='match line';
      d.innerHTML='<span class="score">'+scores[i]+'%</span><div class="t">'+j[0]+'</div><div class="m">'+j[1]+' · match</div>';
      document.getElementById('matches').appendChild(d);
      requestAnimationFrame(function(){d.classList.add('show');});
      if(i===JOBS.length-1){setTimeout(function(){
        document.getElementById('done').style.display='block';
        document.getElementById('cta').classList.add('show');
        setTimeout(function(){location.reload();},5000);
      },800);}
    },i*900);});
  },2200);
});
</script></body></html>
