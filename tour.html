<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RevenueForge — Product Tour</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{margin:0;background:#0B2239;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.frame{width:94%;max-width:760px;background:#F4F6FA;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.top{background:#0B2239;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.top .b{font-family:'Sora';font-weight:800}.top .b b{color:#4D8DFF}
.rec{background:#E11D48;border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.4}}
.dash{display:grid;grid-template-columns:170px 1fr;min-height:420px}
.side{background:#0B2239;padding:14px 8px}
.nav{color:#A9BBD0;font-size:.8rem;font-weight:600;padding:9px 10px;border-radius:8px;margin-bottom:2px;display:flex;gap:8px;align-items:center}
.nav.on{background:#1D4E75;color:#fff}
.main{padding:18px}
.cap{background:#0B2239;color:#fff;padding:14px 18px;font-size:.95rem;font-weight:600;min-height:24px}
.cap i{color:#4D8DFF;margin-right:8px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin-bottom:12px;animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card h4{font-family:'Sora';margin:0 0 8px;font-size:.95rem}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEF2F7;font-size:.85rem}
.row:last-child{border:0}
.badge{background:#DBEAFE;color:#1D4ED8;border-radius:99px;padding:2px 9px;font-size:.7rem;font-weight:700}
.g{background:#DCFCE7;color:#15803D}.a{background:#FEF3C7;color:#B45309}
.btn{background:#2563EB;color:#fff;border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:700;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:10px;padding:12px;text-align:center}
.kpi .n{font-family:'Sora';font-weight:800;font-size:1.2rem}
.kpi .l{color:#64748B;font-size:.68rem}
.bar{height:8px;background:#EEF2F7;border-radius:99px;overflow:hidden;margin:4px 0}
.bar>div{height:100%;background:#2563EB}
.sw{width:44px;height:24px;background:#16A34A;border-radius:99px;position:relative}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%}
@media(max-width:600px){.dash{grid-template-columns:1fr}.side{display:none}}
</style></head><body>
<div class="frame">
  <div class="top"><span class="b">Revenue<b>Forge</b> — Product Tour</span><span class="rec">● REC</span></div>
  <div class="dash"><div class="side" id="side"></div><div class="main" id="main"></div></div>
  <div class="cap" id="cap"></div>
</div>
<script>
var NAV=[['ov','chart-line','Overview'],['robot','robot','My Engine'],['jobs','briefcase','Jobs'],['serv','boxes-stacked','Services'],['social','share-nodes','Social Selling'],['pros','users','Prospects'],['ana','chart-pie','Analytics'],['plan','crown','Plan']];
var S=[
 {n:'ov',c:'Your private revenue dashboard — everything in one place.',h:'<div class="kpis"><div class="kpi"><div class="n">8</div><div class="l">Matches</div></div><div class="kpi"><div class="n">3</div><div class="l">Proposals</div></div><div class="kpi"><div class="n">5</div><div class="l">Prospects</div></div><div class="kpi"><div class="n" style="color:#16A34A">ON</div><div class="l">Engine</div></div></div><div class="card"><h4>☀️ Daily Briefing</h4><div class="row"><span>8 matches · 3 proposals · 2 follow-ups due</span><span class="badge g">Active</span></div></div>'},
 {n:'robot',c:'Turn the engine ON — it searches jobs & sells for you 24/7, even when you close the page.',h:'<div class="card"><h4>🤖 Autonomous Engine</h4><div class="row"><span>Engine</span><span class="sw"></span></div><div class="row"><span>Searching: Reddit · Upwork · LinkedIn · X · RemoteOK…</span><span class="badge">10+ platforms</span></div><div class="row"><span></span><span class="btn">Search now</span></div></div>'},
 {n:'jobs',c:'Every match gets a written proposal — review, approve & submit in one tap.',h:'<div class="card"><h4>💼 Jobs & Proposals</h4><div class="row"><span>Python invoice automation<br><small>Reddit · 82% match</small></span><span class="badge g">Submitted</span></div><div class="row"><span>Web scraping engineer<br><small>RemoteOK · 78%</small></span><span class="badge">Proposal ready</span></div><div class="row"><span></span><span class="btn">Approve & Submit</span></div></div>'},
 {n:'serv',c:'Publish a product with photo/video + your contact — the engine advertises it everywhere.',h:'<div class="card"><h4>📦 My Services</h4><div class="row"><span>🖼️ Logo Design — $50<br><small>contact: WhatsApp</small></span><span class="badge g">live on marketplace</span></div><div class="row"><span>🎬 Video Editing — $80</span><span class="badge g">advertised</span></div><div class="row"><span></span><span class="btn">Publish & Advertise</span></div></div>'},
 {n:'social',c:'One tap shares your product to X, Facebook, Instagram, WhatsApp, Telegram, TikTok & more.',h:'<div class="card"><h4>📣 Social Selling</h4><div class="row"><span>Share "Logo Design" to:</span></div><div class="row"><span class="btn">X</span><span class="btn">FB</span><span class="btn">IG</span><span class="btn">WA</span><span class="btn">TG</span><span class="btn">TT</span></div><div class="row"><span></span><span class="btn">Copy all ads</span></div></div>'},
 {n:'pros',c:'Buyers become prospects — track them from first contact to WON.',h:'<div class="card"><h4>👥 Pipeline</h4><div class="row"><span>New · 2</span><span class="badge">Contacted · 2</span></div><div class="row"><span>Replied · 1</span><span class="badge g">Won · 1 🎉</span></div><div class="row"><span>Follow-up due: Acme Ltd</span><span class="badge a">follow up</span></div></div>'},
 {n:'ana',c:'Analytics show your matches, proposals, wins & revenue at a glance.',h:'<div class="card"><h4>📊 Analytics</h4><div>Matches</div><div class="bar"><div style="width:80%"></div></div><div>Proposals</div><div class="bar"><div style="width:45%"></div></div><div>Won</div><div class="bar"><div style="width:25%"></div></div></div>'},
 {n:'plan',c:'Start free. Upgrade when you\'re ready — paid plans get WhatsApp & Telegram alerts.',h:'<div class="card"><h4>👑 Plans</h4><div class="row"><span>Free — 3 matches</span><span class="badge">current</span></div><div class="row"><span>Starter / Growth / Agency</span><span class="btn">Upgrade</span></div></div>'},
 {n:'ov',c:'Your autonomous revenue engine. Get your FREE audit today → revenueforge.github.io',h:'<div class="card" style="text-align:center"><h4 style="font-size:1.2rem">🚀 RevenueForge</h4><p style="color:#64748B">Find jobs · sell anywhere · win clients — on autopilot.</p><span class="btn" style="font-size:1rem">Get FREE audit → revenueforge.github.io</span></div>'}
];
var i=0;
function nav(id){document.getElementById('side').innerHTML=NAV.map(function(v){return '<div class="nav'+(v[0]===id?' on':'')+'"><i class="fa-solid fa-'+v[1]+'"></i>'+v[2]+'</div>';}).join('');}
function show(){var s=S[i];nav(s.n);document.getElementById('main').innerHTML=s.h;document.getElementById('cap').innerHTML='<i class="fa-solid fa-circle-info"></i>'+s.c;i=(i+1)%S.length;}
show();setInterval(show,4200);
</script></body></html>
