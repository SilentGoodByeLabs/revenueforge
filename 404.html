<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | RevenueForge</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px;background:var(--bg);font-family:'Inter',sans-serif}.code{font-family:'Sora',sans-serif;font-size:120px;font-weight:800;color:var(--navy);line-height:1}h1{font-size:28px;color:var(--navy);margin:10px 0}p{color:var(--muted);max-width:500px;margin-bottom:24px}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}</style>
</head>
<body>
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you are looking for does not exist or has moved. Try the home page .</p>
<div class="actions">
<a href="index.html" class="btn btn-primary">Back to Home</a>
<a href="signin.html" class="btn btn-ghost">Get Started</a>
</div>

<div id="rf-spinner"><div class="rf-spin-circle"></div><p>Searching 188 sources...</p></div>
<style>
#rf-spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.rf-spin-circle{width:52px;height:52px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:rf-spin 0.8s linear infinite;box-shadow:0 4px 12px rgba(37,99,235,0.15);}
@keyframes rf-spin{to{transform:rotate(360deg);}}
#rf-spinner p{margin-top:20px;font-weight:600;color:#1e293b;font-size:16px;letter-spacing:0.3px;}
</style>
<script>
(function(){
  const sp = document.getElementById('rf-spinner');
  window.showRfSpinner = (msg) => { if(sp){ sp.querySelector('p').textContent = msg||'Searching 188 sources...'; sp.style.display='flex'; }};
  window.hideRfSpinner = () => { if(sp) sp.style.display='none'; };
  const origFetch = window.fetch;
  window.fetch = function(...args) {
    const url = typeof args[0]==='string'?args[0]:(args[0]&&args[0].url)||'';
    if(url.includes('search-hiring')||url.includes('pooled-jobs')||url.includes('refresh')){
      showRfSpinner('Searching 188 sources...');
      return origFetch.apply(this,args).finally(hideRfSpinner);
    }
    return origFetch.apply(this,args);
  };
})();
</script>

</body>
</html>
