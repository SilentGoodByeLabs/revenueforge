<style>
body{margin:0;background:#0f172a;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.browser{width:95%;max-width:820px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.bar{background:#dee1e6;padding:8px 12px;display:flex;gap:8px;align-items:center}
.bar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.addr{flex:1;background:#fff;border-radius:99px;padding:6px 14px;font-size:.8rem;color:#333;display:flex;gap:6px;align-items:center}
.addr i{color:#16A34A}
.stage{position:relative;height:440px;background:#F4F6FA;overflow:hidden}
.cap{background:#0B2239;color:#fff;padding:12px 16px;font-size:.95rem;font-weight:600;min-height:22px}
.cap b{color:#4D8DFF}
#cur{position:absolute;z-index:50;transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1);pointer-events:none}
#cur svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.ripple{position:absolute;width:14px;height:14px;border:3px solid #2563EB;border-radius:50%;z-index:49;animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
/* page bits */
.hero{background:linear-gradient(160deg,#0B2239,#1D4E75);color:#fff;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.hero h1{font-family:'Sora';font-size:1.6rem;margin:0}
.btn{background:#2563EB;color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.85rem;display:inline-block}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin:10px;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.inp{background:#fff;border:1.5px solid #E2E8F0;border-radius:8px;padding:9px;font-size:.85rem;color:#333;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #EEF2F7;font-size:.83rem}
.badge{border-radius:99px;padding:2px 9px;font-size:.7rem;font-weight:700}
.b{background:#DBEAFE;color:#1D4ED8}.g{background:#DCFCE7;color:#15803D}.a{background:#FEF3C7;color:#B45309}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px}
.kpi{background:#fff;border-radius:10px;padding:10px;text-align:center}
.kpi .n{font-family:'Sora';font-weight:800}
.kpi .l{color:#64748B;font-size:.65rem}
.side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#0B2239;padding:10px 6px}
.nav{color:#A9BBD0;font-size:.75rem;padding:8px;border-radius:8px;margin-bottom:2px}
.nav.on{background:#1D4E75;color:#fff}
.mainr{margin-left:150px}
.sw{width:44px;height:24px;border-radius:99px;background:#ccc;position:relative;transition:.3s}
.sw.on{background:#16A34A}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.3s}
.sw.on::after{left:23px}
.bar2{height:8px;background:#EEF2F7;border-radius:99px;overflow:hidden;margin:4px 0}
.bar2>div{height:100%;background:#2563EB;width:0;transition:width 1s}
</style></head><body>

function show(){var s=T[i];
